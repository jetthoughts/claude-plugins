name: Harness setup

on:
  pull_request:
    paths:
      - "plugins/harness-setup/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/harness-setup.yml"
  push:
    branches: [master]
    paths:
      - "plugins/harness-setup/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/harness-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-setup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline unit and regression tests
        run: python -B -m unittest discover -s plugins/harness-setup/tests -v
